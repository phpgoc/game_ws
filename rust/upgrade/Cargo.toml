[package]
name = "upgrade"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []

[dependencies]
anyhow = "1"
rand = "0.9"
serde = "1"
serde_json = "1"
share_type_public = { path = "../../share_type_public" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
upgrade_common = { path = "../upgrade_common" }
ws_common = { path = "../common" }

[lints.rust]
unexpected_cfgs = "allow"

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
tokio-tungstenite = "0.29"
