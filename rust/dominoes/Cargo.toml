[package]
name = "dominoes"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []

[dependencies]
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
share_type_public = { path = "../../share_type_public" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
ws_common = { path = "../common" }

[lints.rust]
unexpected_cfgs = "allow"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
