[package]
name = "holdem"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []

[dependencies]
anyhow = "1"
poker_core = { path = "../poker_core" }
rand = "0.10.2"
serde_json = "1"
share_type_public = { path = "../../share_type_public" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ws_common = { path = "../common" }

[lints.rust]
unexpected_cfgs = "allow"
