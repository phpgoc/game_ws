[package]
name = "shenyang_mahjong"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
e2e-wall = []
e2e-fixture = ["e2e-wall"]
official = [
    "dep:data",
    "data/cache-redis",
    "dep:runtime_common",
    "dep:tracing",
]

[lib]
doctest = false

[dependencies]
anyhow = "1"
data = { path = "../../../data", optional = true }
runtime_common = { path = "../../../runtime_common", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
share_type_public = { path = "../../share_type_public" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"] }
ws_common = { path = "../common" }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
